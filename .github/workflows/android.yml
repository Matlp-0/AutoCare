name: Android CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ubuntu-latest already provides Android API 37.0 and Build Tools 37.0.0.
      # The app uses minSdk 33, targetSdk 37 and compileSdk 37.
      - name: Verify Android SDK
        run: |
          sdkmanager --list_installed | grep -E 'platforms;android-37|build-tools;37.0.0'

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
